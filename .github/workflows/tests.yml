name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Stage 1 test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite is fully mocked: no model weights, no network, no writes
      # outside tmp_path.  insightface is imported lazily inside face.app(),
      # which the tests never call — so CI does not need the 330 MB model
      # stack, and the fact that this job passes without it is itself the
      # proof that the import is deferred.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "opencv-python-headless" "numpy" "python-dotenv" \
            "rich" "pycryptodome" "pytest" "pytest-cov"

      - name: Run tests
        run: python -m pytest tests/ --cov=faceproof --cov-report=term-missing

      - name: Fail if coverage regresses below 95%
        run: python -m pytest tests/ --cov=faceproof --cov-fail-under=95 -q
