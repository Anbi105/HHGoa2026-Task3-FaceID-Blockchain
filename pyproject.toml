[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceproof"
version = "1.1.0"
description = "Face AI / Stage 1 probe — Hacker House Goa 2026 Task 3"
# numpy<2 is required by InsightFace 0.7.3 / faiss-cpu (numpy 1.x ABI), and
# numpy 1.26.4 publishes no cp313 wheel — hence the 3.13 upper bound (guide §4).
requires-python = ">=3.11,<3.13"

# Pinned, not ranged.  A resolver picking a new onnxruntime the night
# before the recording is a real way to lose a weekend (§4).
# requirements.lock.txt is the full transitive freeze of every extra.
#
# The BASE install is the attestation core only — canonical JSON, Merkle,
# the registry client and the verifier.  That is deliberate: an independent
# third party re-verifying a bundle must not be made to install a 330 MB
# face-recognition stack to recompute a keccak root.  Extras are additive,
# so anything in `dependencies` is unavoidable for everyone.
dependencies = [
    "python-dotenv==1.2.3",
    "rich==15.0.0",
    "pycryptodome==3.23.0",
    # eth-account is imported directly by faceproof/chain.py, so it is a
    # declared dependency rather than an implicit web3 transitive.
    "web3==8.0.0",
    "eth-utils==6.0.0",
    "eth-account==0.14.0",
]

[project.optional-dependencies]
# Stage 1 — detection, quality gate, ArcFace encoding.  Needs a C toolchain
# on platforms without an insightface wheel (Windows: MSVC Build Tools).
probe = [
    "insightface==0.7.3",
    "onnxruntime==1.29.0",
    "opencv-python-headless==4.11.0.86",
    "numpy==1.26.4",
    "pillow==12.3.0",
]
# Stage 2 — Channel A vector index.
stage2 = [
    "faiss-cpu==1.15.0",
]
# Everything, plus the test tooling.  The mocked suite still imports numpy
# and cv2, so `dev` pulls the probe stack.
dev = [
    "faceproof[probe,stage2]",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
]
# Independent third-party re-verification.  The base install already is the
# verifier; this alias exists so the intent is greppable and so CI can prove
# the crypto core imports with no cv2 / numpy / insightface present:
#   pip install "faceproof[verify]"
#   python -m faceproof.verify_cli out/run-<id>
verify = []

[tool.setuptools.packages.find]
include = ["faceproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the InsightFace model stack (corpus build round-trip)",
]
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning:insightface.*",
]
