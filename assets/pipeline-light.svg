#818b98" stroke-width="1.6" stroke-dasharray="5 4"/><text x="145.0" y="348.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" xml:space="preserve">Stage 2 · discovery</text><text x="145.0" y="364.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle" xml:space="preserve">Stage 3 · attestation</text><text x="40" y="42" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">The pipeline</text><text x="40" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">Consent is the first branch, not a printed disclaimer.</text></svg>
